<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur & Objectif Abonnés YouTube</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e1e1e;
            border: 2px solid #333;
            padding: 35px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 380px;
            position: relative;
        }

        .channel-handle {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .subscriber-count {
            font-size: 3rem;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 25px;
            min-height: 58px;
        }

        .progress-container {
            margin-top: 20px;
            text-align: left;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #bbb;
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* Barre de progression avec contours noirs */
        .progress-bar-outer {
            width: 100%;
            height: 24px;
            background-color: #2a2a2a;
            border: 3.5px solid #000000;
            border-radius: 6px;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Remplissage orange */
        .progress-bar-inner {
            height: 100%;
            background-color: #ff9800;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Conteneur pour la flèche et le pourcentage */
        .indicator-wrapper {
            position: relative;
            height: 45px;
            margin-top: 2px;
        }

        /* Triangle orange pointant vers le haut */
        .arrow-indicator {
            position: absolute;
            left: 0%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 10px solid #ff9800;
            transition: left 0.1s linear;
        }

        /* Pourcentage sous la flèche */
        .percentage-text {
            position: absolute;
            left: 0%;
            transform: translateX(-50%);
            top: 13px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ff9800;
            transition: left 0.1s linear;
            white-space: nowrap;
        }

        /* Bouton Admin */
        .btn-admin-access {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
        }

        .btn-admin-access:hover {
            color: #fff;
            border-color: #777;
        }

        /* Zone réservée à l'administrateur (masquée au départ) */
        .admin-panel {
            display: none;
            margin-top: 15px;
            border-top: 1px dashed #444;
            padding-top: 15px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .admin-panel input {
            background: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            width: 100px;
            text-align: center;
            font-weight: bold;
        }

        .admin-panel button {
            background: #ff9800;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }

        .admin-panel button:hover {
            background: #e68900;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="channel-handle">@Elyesrloi_officiel</div>
        <div id="sub-count" class="subscriber-count">0</div>

        <div class="progress-container">
            <div class="progress-labels">
                <span>Actuel</span>
                <span>Objectif : 2 500</span>
            </div>
            
            <!-- Barre de progression -->
            <div class="progress-bar-outer">
                <div id="progress-fill" class="progress-bar-inner"></div>
            </div>

            <!-- Flèche & Pourcentage -->
            <div class="indicator-wrapper">
                <div id="arrow" class="arrow-indicator"></div>
                <div id="percentage" class="percentage-text">0.0%</div>
            </div>
        </div>

        <!-- Bouton Admin -->
        <button class="btn-admin-access" onclick="requestAdminAccess()">🔒 Admin</button>

        <!-- Formulaire réservé à l'Admin -->
        <div id="admin-panel" class="admin-panel">
            <label for="new-subs-input">Nouveau nombre :</label><br><br>
            <input type="number" id="new-subs-input" value="1200" min="0">
            <button onclick="saveNewCount()">Sauvegarder</button>
        </div>
    </div>

    <script>
        const GOOGLE_TARGET = 2500;
        const SECRET_CODE = "EnekoSecret2307";

        let currentSubscribers = 0;
        let animationTimer = null;

        // 1. Fonction pour demander le mot de passe Admin
        function requestAdminAccess() {
            const codeInput = prompt("Veuillez saisir le code administrateur :");
            if (codeInput === SECRET_CODE) {
                document.getElementById('admin-panel').style.display = 'block';
                alert("Accès Admin autorisé.");
            } else if (codeInput !== null) {
                alert("Code incorrect ! Accès refusé.");
            }
        }

        // 2. Fonction de mise à jour visuelle des éléments (Compteur, Barre, Flèche, %)
        function renderUI(value) {
            // Affichage des chiffres formatés
            document.getElementById('sub-count').innerText = Math.floor(value).toLocaleString('fr-FR');

            // Calcul du pourcentage
            let percent = (value / GOOGLE_TARGET) * 100;
            if (percent > 100) percent = 100;
            if (percent < 0) percent = 0;

            const percentFormatted = percent.toFixed(1) + '%';

            // Mise à jour de la barre orange et de la flèche
            document.getElementById('progress-fill').style.width = percentFormatted;
            document.getElementById('arrow').style.left = percentFormatted;
            document.getElementById('percentage').style.left = percentFormatted;
            document.getElementById('percentage').innerText = percentFormatted;
        }

        // 3. Animation de défilement des chiffres
        function animateTo(targetValue) {
            if (animationTimer) clearInterval(animationTimer);

            const startValue = currentSubscribers;
            const difference = targetValue - startValue;
            const duration = 1500; // Durée de l'animation en ms (1.5s)
            const steps = 60; // 60 étapes d'animation
            const increment = difference / steps;
            const stepTime = duration / steps;
            let currentStep = 0;

            animationTimer = setInterval(() => {
                currentStep++;
                currentSubscribers += increment;

                if (currentStep >= steps) {
                    currentSubscribers = targetValue;
                    renderUI(currentSubscribers);
                    clearInterval(animationTimer);
                } else {
                    renderUI(currentSubscribers);
                }
            }, stepTime);
        }

        // 4. Action appelée par l'Admin au clic sur "Sauvegarder"
        function saveNewCount() {
            const target = parseInt(document.getElementById('new-subs-input').value) || 0;
            animateTo(target);
        }

        // Lancement initial (chargement avec 1 200 abonnés au départ)
        animateTo(1200);
    </script>

</body>
</html>
