<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur d'abonnés YouTube en direct</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .youtube-card {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 320px;
            width: 100%;
        }

        .youtube-card h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #aaa;
            font-weight: 500;
        }

        .subscriber-count {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .label {
            font-size: 0.9rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="youtube-card">
        <h3><span class="live-dot"></span>Abonnés en direct</h3>
        <div id="subs" class="subscriber-count">...</div>
        <div class="label">Abonnés</div>
    </div>

    <script>
        const CHANNEL_ID = 'UCfX-1RkxzeTxS6Mxajn7W7Q'; 
        
        async function getSubscribers() {
            try {
                // Utilisation d'un proxy pour cibler directement la page de la chaîne via son ID
                const targetUrl = `https://www.youtube.com/channel/${CHANNEL_ID}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // Recherche de la donnée d'abonnés dans le code source de la page YouTube
                const match = data.contents.match(/"subscriberCountText":\{"accessibility":\{"accessibilityData":\{"label":"([^"]+)"/);
                
                if (match && match[1]) {
                    // Extrait le texte (ex: "123 subscribers" -> "123")
                    const subText = match[1].replace('subscribers', '').replace('abonné·e·s', '').replace('abonnés', '').trim();
                    document.getElementById('subs').innerText = subText;
                } else {
                    document.getElementById('subs').innerText = "Indisponible";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('subs').innerText = "Erreur";
            }
        }

        // Charger au démarrage de la page
        getSubscribers();

        // Actualiser automatiquement toutes les 60 secondes
        setInterval(getSubscribers, 60000);
    </script>

</body>
</html>
